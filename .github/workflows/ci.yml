name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the build does not depend on real secrets.
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy
      DATABASE_URL_UNPOOLED: postgresql://user:password@localhost:5432/dummy
      BETTER_AUTH_SECRET: dummy-secret-for-ci-only
      BETTER_AUTH_URL: http://localhost:3000
      APP_ENV: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 結合テスト: the real handlers and server functions on a throw-away PostgreSQL
  # (the container lives for this job only; nothing outside it is touched).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mieroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mieroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/mieroom_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
